name: Go readability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.4
          install-only: true
      - run: python3 -m unittest discover -s scripts/tests -p test_go_lint_baseline.py -v
      - run: python3 scripts/check_go_lint_baseline.py --check
